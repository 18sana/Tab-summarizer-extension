<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archive History</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap');

    :root {
      --bg-primary: #0a0814;
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-border: rgba(255, 255, 255, 0.06);
      --card-hover-border: rgba(255, 255, 255, 0.12);
      --text-primary: #ffffff;
      --text-secondary: #94a3b8;
      --accent-purple: #818cf8;
      --accent-pink: #c084fc;
      --accent-teal: #2dd4bf;
      --success: #10b981;
      --success-bg: rgba(16, 185, 129, 0.06);
      --success-border: rgba(16, 185, 129, 0.15);
      --error: #ef4444;
      --error-bg: rgba(239, 68, 68, 0.06);
      --error-border: rgba(239, 68, 68, 0.15);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 600px;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      position: relative;
      overflow-x: hidden;
      min-height: 100vh;
      line-height: 1.5;
    }

    /* Background Glowing Orbs */
    .bg-glow-1 {
      position: absolute;
      top: -80px;
      left: -80px;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(129, 140, 248, 0.2) 0%, rgba(129, 140, 248, 0) 70%);
      filter: blur(50px);
      pointer-events: none;
      z-index: 0;
    }

    .bg-glow-2 {
      position: absolute;
      bottom: -80px;
      right: -80px;
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, rgba(192, 132, 252, 0.12) 0%, rgba(192, 132, 252, 0) 70%);
      filter: blur(55px);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Header */
    .header {
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 6px;
    }

    .header h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.8px;
      background: linear-gradient(135deg, #ffffff 40%, #c7d2fe 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .header p {
      font-size: 13.5px;
      color: var(--text-secondary);
    }

    /* History List Container */
    .history-list {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      max-height: 480px;
      overflow-y: auto;
    }

    /* Individual History Row */
    .history-item {
      padding: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      display: flex;
      gap: 14px;
      align-items: flex-start;
      transition: all 0.2s ease;
    }

    .history-item:hover {
      background: rgba(255, 255, 255, 0.02);
    }

    .history-item:last-child {
      border-bottom: none;
    }

    .history-icon {
      font-size: 20px;
      background: rgba(255, 255, 255, 0.04);
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.06);
      flex-shrink: 0;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    .history-content {
      flex: 1;
      min-width: 0;
    }

    .history-title {
      font-weight: 600;
      font-size: 14px;
      color: #ffffff;
      margin-bottom: 4px;
      word-break: break-word;
    }

    .history-url {
      font-size: 11px;
      color: #64748b;
      margin-bottom: 8px;
      font-family: 'JetBrains Mono', monospace;
      word-break: break-all;
    }

    .history-meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .meta-badge {
      display: inline-block;
      background: rgba(129, 140, 248, 0.05);
      color: #a5b4fc;
      border: 1px solid rgba(129, 140, 248, 0.12);
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.1px;
    }

    /* Actions buttons inside Row */
    .history-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
      align-self: center;
    }

    .history-actions button {
      padding: 6px 14px;
      border: none;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn-open {
      background: rgba(16, 185, 129, 0.08);
      border: 1px solid rgba(16, 185, 129, 0.2);
      color: #a7f3d0;
    }

    .btn-open:hover {
      background: var(--success);
      color: white;
      box-shadow: 0 4px 10px rgba(16, 185, 129, 0.25);
      transform: translateY(-1px);
    }

    .btn-open:active {
      transform: translateY(0);
    }

    .btn-unarchive {
      background: rgba(239, 68, 68, 0.06);
      border: 1px solid rgba(239, 68, 68, 0.15);
      color: #fca5a5;
    }

    .btn-unarchive:hover {
      background: var(--error);
      color: white;
      box-shadow: 0 4px 10px rgba(239, 68, 68, 0.25);
      transform: translateY(-1px);
    }

    .btn-unarchive:active {
      transform: translateY(0);
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 50px 30px;
      color: #64748b;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .empty-state-icon {
      font-size: 36px;
      background: rgba(255, 255, 255, 0.03);
      width: 60px;
      height: 60px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
    }

    .empty-state-text {
      font-size: 14.5px;
      font-weight: 700;
      color: #ffffff;
    }

    /* Scrollbar styling */
    .history-list::-webkit-scrollbar {
      width: 6px;
    }

    .history-list::-webkit-scrollbar-track {
      background: transparent;
    }

    .history-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 10px;
    }

    .history-list::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.16);
    }

    /* Info Box */
    .info-box {
      background: rgba(129, 140, 248, 0.04);
      border: 1px solid rgba(129, 140, 248, 0.1);
      border-radius: 12px;
      padding: 14px;
      color: #cbd5e1;
      font-size: 12.5px;
      line-height: 1.5;
    }

    .info-box strong {
      display: block;
      margin-bottom: 4px;
      color: #e2e8f0;
    }

    .loading {
      text-align: center;
      padding: 50px;
      color: #64748b;
      font-size: 13.5px;
      font-weight: 550;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-top-color: var(--accent-purple);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- Background glows for modern futuristic feel -->
  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>

  <div class="container">
    <div class="header">
      <h1>
        <svg width="26" height="26" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" style="filter: drop-shadow(0 0 8px rgba(129, 140, 248, 0.4));">
          <defs>
            <linearGradient id="hist-logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#818cf8" />
              <stop offset="100%" stop-color="#c084fc" />
            </linearGradient>
          </defs>
          <rect x="6" y="6" width="36" height="36" rx="10" fill="url(#hist-logo-grad)" />
          <rect x="14" y="14" width="20" height="20" rx="3" fill="#0a0814" opacity="0.85" />
          <line x1="18" y1="19" x2="30" y2="19" stroke="url(#hist-logo-grad)" stroke-width="2" stroke-linecap="round" />
          <line x1="18" y1="24" x2="26" y2="24" stroke="url(#hist-logo-grad)" stroke-width="2" stroke-linecap="round" />
          <path d="M31 26 L32.5 29 L35.5 30 L32.5 31 L31 34 L29.5 31 L26.5 30 L29.5 29 Z" fill="#2dd4bf" />
        </svg>
        Archive History
      </h1>
      <p>Your recently archived tabs (last 30 days)</p>
    </div>

    <!-- Conceptual AI Search Panel -->
    <div class="ai-search-container" style="background: rgba(255, 255, 255, 0.02); border: 1.5px solid rgba(139, 92, 246, 0.25); border-radius: 16px; padding: 14px 18px; display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; backdrop-filter: blur(12px); box-shadow: 0 8px 32px rgba(139, 92, 246, 0.1);">
      <div style="display: flex; align-items: center; gap: 12px; width: 100%;">
        <span style="font-size: 20px; text-shadow: 0 0 10px rgba(192, 132, 252, 0.5);">🔍</span>
        <input type="text" id="aiSearchInput" placeholder="Ask AI: 'Where did we talk about Next.js config errors?'..." style="flex: 1; background: transparent; border: none; font-size: 13.5px; color: white; font-weight: 600; font-family: inherit; outline: none; border-bottom: 1px solid transparent; transition: all 0.2s;" />
        <button id="aiSearchBtn" class="btn-primary" style="padding: 8px 16px; margin: 0; font-size: 12.5px; font-weight: 700; border-radius: 10px; flex-shrink: 0; height: 36px; display: flex; align-items: center; justify-content: center; gap: 6px; background: linear-gradient(135deg, #818cf8 0%, #c084fc 100%); cursor: pointer; border: none; color: white; box-shadow: 0 4px 15px rgba(129, 140, 248, 0.2);">
          <span>Ask AI</span>
        </button>
      </div>
      <div id="aiSearchLoading" style="display: none; align-items: center; gap: 8px; font-size: 11.5px; color: #a5b4fc;">
        <div class="spinner" style="width: 14px; height: 14px; border-width: 1.5px;"></div>
        <span>AI is analyzing history summaries and evaluating semantic fit...</span>
      </div>
    </div>

    <div class="history-list" id="historyList">
      <div class="loading">
        <div class="spinner"></div>
        <span>Loading history...</span>
      </div>
    </div>

    <div class="info-box">
      <strong>💡 Tip:</strong> View your archive history and undo recent archives if needed. Click "Open in Notion" to see the full page.
    </div>
  </div>

  <script src="../scripts/utils/auth.js" defer></script>
  <script src="../scripts/pages/archive-history.js" defer></script>
</body>
</html>
