<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tab Summarizer: Workspace Preview Desk</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap');

    :root {
      --bg-primary: #0a0814;
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-border: rgba(255, 255, 255, 0.06);
      --text-primary: #ffffff;
      --text-secondary: #94a3b8;
      --accent-purple: #818cf8;
      --accent-pink: #c084fc;
      --accent-teal: #2dd4bf;
      --danger: #ef4444;
      --success: #10b981;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      padding-bottom: 80px;
    }

    /* Ambient Glowing Orbs */
    .orb-1 {
      position: absolute;
      top: -10%;
      right: 10%;
      width: 40vw;
      height: 40vw;
      background: radial-gradient(circle, rgba(192, 132, 252, 0.08) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
      filter: blur(80px);
    }

    .orb-2 {
      position: absolute;
      bottom: -10%;
      left: -5%;
      width: 45vw;
      height: 45vw;
      background: radial-gradient(circle, rgba(129, 140, 248, 0.06) 0%, transparent 75%);
      pointer-events: none;
      z-index: 0;
      filter: blur(100px);
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 24px;
      position: relative;
      z-index: 1;
    }

    /* Dashboard Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 24px;
    }

    .header-logo-title {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .logo-glow {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-glow::after {
      content: '';
      position: absolute;
      width: 32px;
      height: 32px;
      background: rgba(192, 132, 252, 0.4);
      border-radius: 50%;
      filter: blur(10px);
      z-index: -1;
    }

    .header h1 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.8px;
      background: linear-gradient(135deg, #ffffff 30%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header p {
      font-size: 14px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    /* Control Panel Controls */
    .control-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 10px 16px;
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.15);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent-purple) 0%, var(--accent-pink) 100%);
      border: none;
      border-radius: 12px;
      padding: 10px 20px;
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(129, 140, 248, 0.2);
      margin-left: auto;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(129, 140, 248, 0.3);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* Tab List Cards */
    .tab-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .tab-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      gap: 16px;
      backdrop-filter: blur(12px);
      transition: all 0.25s ease;
    }

    .tab-card:hover {
      border-color: rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.04);
    }

    .checkbox-container {
      display: flex;
      align-items: flex-start;
      padding-top: 2px;
    }

    .tab-checkbox {
      appearance: none;
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      border: 1.5px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.02);
      cursor: pointer;
      position: relative;
      transition: all 0.2s ease;
    }

    .tab-checkbox:checked {
      background: linear-gradient(135deg, var(--accent-purple) 0%, var(--accent-pink) 100%);
      border-color: transparent;
    }

    .tab-checkbox:checked::after {
      content: '✓';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -52%);
      color: white;
      font-size: 11px;
      font-weight: bold;
    }

    .tab-details {
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1;
    }

    .tab-header-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .tab-favicon {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      object-fit: contain;
    }

    .tab-title-input {
      background: transparent;
      border: none;
      border-bottom: 1.5px solid transparent;
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      width: 100%;
      padding: 2px 0;
      transition: border-color 0.2s ease;
    }

    .tab-title-input:focus {
      outline: none;
      border-color: var(--accent-purple);
    }

    .tab-meta {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .tab-url-pill {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--text-secondary);
      background: rgba(255, 255, 255, 0.03);
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid var(--card-border);
      max-width: 320px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tab-collection-pill {
      font-size: 10.5px;
      font-weight: 700;
      color: var(--accent-teal);
      background: rgba(45, 212, 191, 0.08);
      border: 1px solid rgba(45, 212, 191, 0.15);
      padding: 3px 8px;
      border-radius: 6px;
    }

    .tab-notes-textarea {
      background: rgba(0, 0, 0, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 10px;
      padding: 10px 12px;
      color: #e2e8f0;
      font-size: 12.5px;
      font-family: inherit;
      resize: vertical;
      min-height: 52px;
      width: 100%;
      transition: all 0.2s ease;
    }

    .tab-notes-textarea:focus {
      outline: none;
      border-color: rgba(255, 255, 255, 0.1);
      background: rgba(0, 0, 0, 0.2);
    }

    .tab-notes-textarea::placeholder {
      color: rgba(255, 255, 255, 0.25);
    }

    /* Status Notifications overlay */
    .status-overlay {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: rgba(10, 8, 20, 0.95);
      border: 1.5px solid var(--accent-purple);
      box-shadow: 0 8px 32px rgba(129, 140, 248, 0.2);
      border-radius: 16px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 999;
      transform: translateY(120%);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      backdrop-filter: blur(12px);
    }

    .status-overlay.active {
      transform: translateY(0);
    }

    .status-spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-top-color: var(--accent-purple);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .status-text {
      font-size: 13.5px;
      font-weight: 600;
      color: #ffffff;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="orb-1"></div>
  <div class="orb-2"></div>

  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="header-logo-title">
        <div class="logo-glow">
          <svg width="34" height="34" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="prev-logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#c084fc" />
                <stop offset="100%" stop-color="#818cf8" />
              </linearGradient>
            </defs>
            <rect width="48" height="48" rx="12" fill="url(#prev-logo-grad)" />
            <rect x="14" y="14" width="20" height="20" rx="4" fill="#0a0814" opacity="0.9" />
            <path d="M21 24 H27 M24 21 V27" stroke="url(#prev-logo-grad)" stroke-width="2.5" stroke-linecap="round" />
          </svg>
        </div>
        <div>
          <h1>Workspace Preview Desk</h1>
          <p>Curate, edit, and organize research highlights before sending to Notion</p>
        </div>
      </div>
    </div>

    <!-- Actions Control Panel -->
    <div class="control-actions">
      <button class="btn-secondary" id="selectAllBtn">Select All</button>
      <button class="btn-secondary" id="deselectAllBtn">Deselect All</button>
      <button class="btn-primary" id="archiveSelectedBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        Archive Selected (<span id="selectedCountLabel">0</span>)
      </button>
    </div>

    <!-- Tab cards list container -->
    <div class="tab-list" id="tabListContainer">
      <!-- Generated dynamically by JS -->
    </div>
  </div>

  <!-- Status Notification Overlay -->
  <div class="status-overlay" id="statusOverlay">
    <div class="status-spinner"></div>
    <div class="status-text" id="statusOverlayText">Analyzing & archiving selected tabs...</div>
  </div>

  <script src="../scripts/pages/tab-preview.js"></script>
</body>
</html>
