<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="48" height="48" fill="url(#grad1)" rx="8"/>
  <g transform="translate(24, 24)">
    <!-- Notebook icon -->
    <rect x="-14" y="-14" width="28" height="28" fill="none" stroke="white" stroke-width="2" rx="2"/>
    <line x1="-14" y1="-6" x2="14" y2="-6" stroke="white" stroke-width="2"/>
    <line x1="-14" y1="2" x2="14" y2="2" stroke="white" stroke-width="2"/>
    <line x1="-14" y1="10" x2="14" y2="10" stroke="white" stroke-width="2"/>
    <!-- Bookmark corner -->
    <polygon points="-14,-14 -10,-10 -14,-10" fill="white"/>
  </g>
</svg>
